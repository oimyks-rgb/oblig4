{% extends "base.html" %}
{% block title %}Log in · Ekte Mat Online{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="form narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <label>E-mail
    <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
  </label>
  <label>Password
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button class="button" type="submit">Log in</button>
</form>
<p>New customer? <a href="{{ url_for('account.register', next=next) if next else url_for('account.register') }}">Create an account</a></p>
{% endblock %}
